[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-talk"
version = "0.1.0"
description = "2D sprite talking-head animation: bottom-anchored body warp, loudness mouth track, blinks, sync measure, motion calibration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "opencv-python-headless", "Pillow"]

[project.optional-dependencies]
zh = ["pypinyin"]
align = ["torch", "torchaudio", "pypinyin"]

[project.scripts]
sprite-talk = "sprite_talk.cli:main"

[tool.setuptools]
packages = ["sprite_talk"]
